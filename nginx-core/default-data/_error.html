<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!--# if expr="$status = 502" -->
  <meta http-equiv="refresh" content="2"/>
  <!--# endif -->
  <title><!--# if expr="$status = 502" -->Updating...<!--# else -->Error <!--# echo var="status" default="" --><!--# endif --></title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text-primary: #1a202c;
      --text-secondary: #718096;
      --accent: #4f46e5;
      --accent-alt: #7c3aed;
      --accent-light: #eef2ff;
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 32px rgba(0,0,0,.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0f14;
        --surface: #161921;
        --border: #2a2f3e;
        --text-primary: #e2e8f0;
        --text-secondary: #8892a4;
        --accent: #818cf8;
        --accent-alt: #a78bfa;
        --accent-light: #1e2040;
        --shadow: 0 1px 3px rgba(0,0,0,.3), 0 8px 32px rgba(0,0,0,.4);
      }
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'Helvetica Neue', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      min-height: 100%;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 3rem 3.5rem 2.75rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0 0 auto 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-alt));
    }

    /* ── Error (non-502) ───────────────────────────── */

    .error-code {
      font-size: clamp(5rem, 20vw, 8rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--accent) 30%, var(--accent-alt));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      user-select: none;
      margin-bottom: 0.5rem;
    }

    .error-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .divider {
      width: 36px;
      height: 2px;
      border-radius: 2px;
      background: var(--border);
      margin: 1.25rem auto;
    }

    .error-message {
      font-size: 0.9375rem;
      color: var(--text-secondary);
      line-height: 1.65;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 2rem;
      padding: 0.55rem 1.25rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: color .15s, border-color .15s, background .15s;
    }

    .back-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-light);
    }

    /* ── Maintenance (502) ─────────────────────────── */

    .maintenance-icon {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.75rem;
    }

    .maintenance-icon svg {
      width: 32px;
      height: 32px;
      color: var(--accent);
      animation: spin 3s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .maintenance-title {
      font-size: 1.375rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      margin-bottom: 0.6rem;
    }

    .maintenance-message {
      font-size: 0.9375rem;
      color: var(--text-secondary);
      line-height: 1.65;
    }

    .dots {
      display: inline-flex;
      gap: 7px;
      margin-top: 1.75rem;
    }

    .dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .dots span:nth-child(2) { animation-delay: .25s; }
    .dots span:nth-child(3) { animation-delay: .5s;  }

    @keyframes pulse {
      0%, 100% { transform: scale(.55); opacity: .35; }
      50%       { transform: scale(1);  opacity: 1;   }
    }

    @media (max-width: 480px) {
      .card { padding: 2.25rem 1.75rem 2rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <!--# if expr="$status = 502" -->

    <div class="maintenance-icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 6V4m0 2a2 2 0 1 0 0 4m0-4a2 2 0 1 1 0 4m-6 8a2 2 0 1 0 0-4m0 4a2 2 0 1 1 0-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 1 0 0-4m0 4a2 2 0 1 1 0-4m0 4v2m0-6V4"/>
      </svg>
    </div>

    <div class="maintenance-title">Updating our website</div>
    <p class="maintenance-message">
      We'll be back in just a moment.<br/>
      Applying the latest updates — please hold on.
    </p>

    <div class="dots">
      <span></span><span></span><span></span>
    </div>

    <!--# else -->

    <div class="error-code"><!--# echo var="status" default="Err" --></div>
    <div class="error-title"><!--# echo var="status_text" default="Something went wrong" --></div>

    <div class="divider"></div>

    <p class="error-message">
      Sorry, the page you are looking for is currently unavailable.<br/>
      Please try again later.
    </p>

    <button type="button" class="back-btn" onclick="history.length > 1 ? history.back() : (location.href='/')">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none"
           viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 19l-7-7 7-7"/>
      </svg>
      Go Back
    </button>

    <!--# endif -->
  </div>
</body>
</html>
